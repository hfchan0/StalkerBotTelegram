services:
  monitor:
    build: .
    container_name: instagram-archive-monitor
    env_file: .env
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - ./data:/data
      - ./secrets/instagram-cookies.txt:/run/secrets/instagram-cookies.txt:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true